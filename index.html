<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Weather App Pro</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
min-height:100vh;
color:white;
background:linear-gradient(to right,#1d4350,#a43931);
transition:0.4s;
padding:20px;
}

.dark{background:#000;}

.container{max-width:1200px;margin:auto;}

.app{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
}

.title{text-align:center;font-size:36px;}

.search-box{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}

.search-box input{
flex:1;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

#search-btn{background:#00b894;color:#fff;}
#location-btn{background:#0984e3;color:#fff;}
#dark-btn{background:#2d3436;color:#fff;}

.weather{display:none;}

.top{display:flex;justify-content:space-between;flex-wrap:wrap;}

.temp{font-size:70px;font-weight:700;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.15);
padding:15px;
border-radius:12px;
text-align:center;
}

.forecast-container,.hourly-container{
display:flex;
overflow-x:auto;
gap:10px;
margin-top:15px;
}

.forecast-card,.hour-card{
min-width:140px;
background:rgba(255,255,255,0.15);
padding:10px;
border-radius:10px;
text-align:center;
}

canvas{
background:white;
border-radius:10px;
margin-top:20px;
padding:10px;
}

.history span{
display:inline-block;
padding:6px 12px;
margin:5px;
background:rgba(255,255,255,0.15);
border-radius:20px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<div class="app">

<h1 class="title">Weather App Pro</h1>

<div class="search-box">
<input id="city" placeholder="Enter city">
<button id="search-btn">Search</button>
<button id="location-btn">Location</button>
<button id="dark-btn">Mode</button>
</div>

<div id="history" class="history"></div>

<div id="weather" class="weather"></div>

</div>
</div>

<script>
const apiKey = "9b14b2cbfdfa41f6b63172731261605";

let chartInstance = null;

const cityInput = document.getElementById("city");
const weatherDiv = document.getElementById("weather");

document.getElementById("search-btn").onclick = () => {
if(cityInput.value.trim()) getWeather(cityInput.value);
};

cityInput.addEventListener("keypress",(e)=>{
if(e.key==="Enter") getWeather(cityInput.value);
});

document.getElementById("dark-btn").onclick = () => {
document.body.classList.toggle("dark");
};

document.getElementById("location-btn").onclick = () => {
navigator.geolocation.getCurrentPosition(pos=>{
const {latitude,longitude}=pos.coords;
fetchWeather(`${latitude},${longitude}`);
});
};

function getWeather(city){
fetchWeather(city);
saveSearch(city);
}

function fetchWeather(q){
fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${q}&days=7&aqi=yes`)
.then(res=>res.json())
.then(data=>{
if(data.error) return alert(data.error.message);
render(data);
})
.catch(()=>alert("API Error"));
}

function render(data){
weatherDiv.style.display="block";

const c=data.current;
const loc=data.location;
const f=data.forecast.forecastday;

weatherDiv.innerHTML=`
<div class="top">
<div>
<h2>${loc.name}, ${loc.country}</h2>
<p>${loc.localtime}</p>
<div class="temp">${c.temp_c}°C</div>
<p>${c.condition.text}</p>
</div>
<img src="https:${c.condition.icon}">
</div>

<div class="grid">
<div class="card"><h3>Humidity</h3><p>${c.humidity}%</p></div>
<div class="card"><h3>Wind</h3><p>${c.wind_kph} km/h</p></div>
<div class="card"><h3>Pressure</h3><p>${c.pressure_mb}</p></div>
<div class="card"><h3>UV</h3><p>${c.uv}</p></div>
<div class="card"><h3>Air</h3><p>${c.air_quality?Math.round(c.air_quality.pm2_5):"N/A"}</p></div>
<div class="card"><h3>Sunrise</h3><p>${f[0].astro.sunrise}</p></div>
</div>

<h3>Hourly</h3>
<div class="hourly-container">
${f[0].hour.slice(0,12).map(h=>`
<div class="hour-card">
<p>${h.time.split(" ")[1]}</p>
<img src="https:${h.condition.icon}">
<p>${h.temp_c}°C</p>
</div>`).join("")}
</div>

<h3>7 Day Forecast</h3>
<div class="forecast-container">
${f.map(d=>`
<div class="forecast-card">
<p>${new Date(d.date).toDateString().slice(0,3)}</p>
<img src="https:${d.day.condition.icon}">
<p>${d.day.avgtemp_c}°C</p>
</div>`).join("")}
</div>

<canvas id="chart"></canvas>
`;

drawChart(f);
loadHistory();
}

function drawChart(f){
const ctx=document.getElementById("chart");

if(chartInstance) chartInstance.destroy();

chartInstance=new Chart(ctx,{
type:"line",
data:{
labels:f.map(d=>d.date.slice(5)),
datasets:[{
label:"Temp",
data:f.map(d=>d.day.avgtemp_c),
borderWidth:2
}]
}
});
}

function saveSearch(city){
let h=JSON.parse(localStorage.getItem("h")||"[]");
if(!h.includes(city)) h.push(city);
localStorage.setItem("h",JSON.stringify(h));
}

function loadHistory(){
let h=JSON.parse(localStorage.getItem("h")||"[]");
const div=document.getElementById("history");
div.innerHTML=h.slice(-5).map(c=>
`<span onclick="getWeather('${c}')">${c}</span>`
).join("");
}
</script>

</body>
</html>
