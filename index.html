<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Weather App</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial,sans-serif;

background:linear-gradient(
to right,
#1d4350,
#a43931
);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;
}

.app{

width:100%;

max-width:900px;

background:rgba(255,255,255,0.1);

padding:25px;

border-radius:20px;

backdrop-filter:blur(10px);

color:white;
}

h1{

text-align:center;

margin-bottom:20px;
}

input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:10px;

font-size:18px;

margin-bottom:20px;
}
<button id="location-btn">
Use My Location
</button>
#weather{

display:none;
}

.temp{

font-size:70px;

font-weight:bold;

margin:20px 0;
}

.condition{

font-size:25px;

margin-bottom:15px;
}

.details{

line-height:2;
}

.forecast-container{

display:flex;

gap:15px;

overflow-x:auto;

margin-top:20px;
}

.card{

min-width:140px;

background:rgba(255,255,255,0.15);

padding:15px;

border-radius:15px;

text-align:center;
}

.card img{

width:55px;
}

</style>

</head>

<body>

<div class="app">

<h1>Weather App</h1>

<input
type="text"
id="city"
placeholder="Enter city name">

<div id="weather"></div>

</div>

<script>

const apiKey =
"9b14b2cbfdfa41f6b63172731261605";

const input =
document.getElementById("city");

input.addEventListener(
"keypress",
function(event){

if(event.key === "Enter"){

getWeather(input.value);

}

}
);

function getWeather(city){

fetch(
`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=7&aqi=no&alerts=no`
)

.then(response => response.json())

.then(data => {

console.log(data);

if(data.error){

alert(data.error.message);

return;
}

showWeather(data);

})

.catch(error => {

console.log(error);

alert("Weather fetch failed");

});

}

function showWeather(data){

const weather =
document.getElementById("weather");

weather.style.display =
"block";

let current =
data.current;

let location =
data.location;

let forecast =
data.forecast.forecastday;

weather.innerHTML = `

<h2>

${location.name},
${location.country}

</h2>

<p>

${location.localtime}

</p>

<div class="temp">

${current.temp_c}°C

</div>

<div class="condition">

${current.condition.text}

<img
src="https:${current.condition.icon}">

</div>

<div class="details">

Humidity:
${current.humidity}% <br>

Wind:
${current.wind_kph} KM/H <br>

Pressure:
${current.pressure_mb} mb <br>

Feels Like:
${current.feelslike_c}°C

</div>

<hr style="margin:20px 0;">

<h2>

7-Day Forecast

</h2>

<div class="forecast-container"
id="forecast">

</div>
`;

showForecast(forecast);

}

function showForecast(days){

const forecast =
document.getElementById("forecast");

forecast.innerHTML = "";

days.forEach(day => {

let date =
new Date(day.date);

forecast.innerHTML += `

<div class="card">

<h3>

${date.toLocaleDateString(
'en-US',
{
weekday:'short'
}
)}

</h3>

<img
src="https:${day.day.condition.icon}">

<p>

${day.day.avgtemp_c}°C

</p>

<p>

${day.day.condition.text}

</p>

</div>
`;

});

}

</script>

</body>
</html>
