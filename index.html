<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App Pro + Map + Alerts</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(to right,#1d4350,#a43931);
color:white;
padding:20px;
transition:0.4s;
}

.dark{background:#000;}

.container{max-width:1100px;margin:auto;}

.app{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
padding:20px;
border-radius:20px;
}

.title{text-align:center;font-size:32px;}

.search-box{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0;}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

#search-btn{background:#00b894;color:white;}
#location-btn{background:#0984e3;color:white;}
#dark-btn{background:#2d3436;color:white;}

.weather{display:none;}

.top{display:flex;justify-content:space-between;flex-wrap:wrap;}

.temp{font-size:60px;font-weight:700;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
margin-top:15px;
}

.card{
background:rgba(255,255,255,0.15);
padding:12px;
border-radius:10px;
text-align:center;
}

.forecast-container,.hourly-container{
display:flex;
overflow-x:auto;
gap:10px;
margin-top:10px;
}

.forecast-card,.hour-card{
min-width:120px;
background:rgba(255,255,255,0.15);
padding:10px;
border-radius:10px;
text-align:center;
}

canvas{
background:white;
border-radius:10px;
margin-top:15px;
padding:10px;
}

#map{
height:300px;
margin-top:15px;
border-radius:15px;
}
</style>
</head>

<body>

<div class="container">
<div class="app">

<h1 class="title">🌦 Weather App Pro</h1>

<div class="search-box">
<input id="city" placeholder="Enter city">
<button id="search-btn">Search</button>
<button id="location-btn">Location</button>
<button id="dark-btn">Mode</button>
</div>

<div id="history"></div>

<div id="weather" class="weather"></div>

</div>
</div>

<script>
const apiKey = "9b14b2cbfdfa41f6b63172731261605";

let map;
let marker;
let chartInstance;

const cityInput = document.getElementById("city");
const weatherDiv = document.getElementById("weather");

/* ================= NOTIFICATION ================= */

if ("Notification" in window) {
  Notification.requestPermission();
}

/* ================= MAP ================= */

function loadMap(lat, lon) {

  if (!map) {
    map = L.map("map").setView([lat, lon], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    marker = L.marker([lat, lon]).addTo(map);

  } else {
    map.setView([lat, lon], 10);
    marker.setLatLng([lat, lon]);
  }
}

/* ================= ALERT SYSTEM ================= */

function sendNotification(msg) {
  if (Notification.permission === "granted") {
    new Notification("Weather Alert 🚨", {
      body: msg,
      icon: "https://cdn-icons-png.flaticon.com/512/1116/1116453.png"
    });
  }
}

function checkAlerts(c) {
  let msg = "";

  if (c.condition.text.toLowerCase().includes("thunder"))
    msg = "Thunderstorm alert!";
  else if (c.wind_kph > 40)
    msg = "Strong wind alert!";
  else if (c.precip_mm > 5)
    msg = "Heavy rain alert!";

  if (msg) sendNotification(msg);
}

/* ================= FETCH ================= */

document.getElementById("search-btn").onclick = () => {
  if (cityInput.value) getWeather(cityInput.value);
};

document.getElementById("location-btn").onclick = () => {
  navigator.geolocation.getCurrentPosition(pos => {
    getWeather(`${pos.coords.latitude},${pos.coords.longitude}`);
  });
};

document.getElementById("dark-btn").onclick = () => {
  document.body.classList.toggle("dark");
};

function getWeather(q) {
  fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${q}&days=7&aqi=yes`)
    .then(r => r.json())
    .then(data => {
      if (data.error) return alert(data.error.message);
      render(data);
      saveHistory(q);
    });
}

/* ================= RENDER ================= */

function render(data) {

  const c = data.current;
  const loc = data.location;
  const f = data.forecast.forecastday;

  weatherDiv.style.display = "block";

  checkAlerts(c);

  weatherDiv.innerHTML = `
    <div class="top">
      <div>
        <h2>${loc.name}, ${loc.country}</h2>
        <p>${loc.localtime}</p>
        <div class="temp">${c.temp_c}°C</div>
        <p>${c.condition.text}</p>
      </div>
      <img src="https:${c.condition.icon}">
    </div>

    <div class="grid">
      <div class="card">Humidity<br>${c.humidity}%</div>
      <div class="card">Wind<br>${c.wind_kph} km/h</div>
      <div class="card">Pressure<br>${c.pressure_mb}</div>
      <div class="card">UV<br>${c.uv}</div>
      <div class="card">Air<br>${c.air_quality ? Math.round(c.air_quality.pm2_5) : "N/A"}</div>
      <div class="card">Sunrise<br>${f[0].astro.sunrise}</div>
      <div class="card">Sunset<br>${f[0].astro.sunset}</div>
    </div>

    <h3>Hourly</h3>
    <div class="hourly-container">
      ${f[0].hour.slice(0,12).map(h=>`
        <div class="hour-card">
          <p>${h.time.split(" ")[1]}</p>
          <img src="https:${h.condition.icon}">
          <p>${h.temp_c}°C</p>
        </div>
      `).join("")}
    </div>

    <h3>7 Day Forecast</h3>
    <div class="forecast-container">
      ${f.map(d=>`
        <div class="forecast-card">
          <p>${new Date(d.date).toDateString().slice(0,3)}</p>
          <img src="https:${d.day.condition.icon}">
          <p>${d.day.avgtemp_c}°C</p>
        </div>
      `).join("")}
    </div>

    <div id="map"></div>

    <canvas id="chart"></canvas>
  `;

  loadMap(loc.lat, loc.lon);
  drawChart(f);
  loadHistory();
}

/* ================= CHART ================= */

function drawChart(f) {

  const ctx = document.getElementById("chart");

  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: f.map(d => d.date.slice(5)),
      datasets: [{
        label: "Temp °C",
        data: f.map(d => d.day.avgtemp_c),
        borderWidth: 2
      }]
    }
  });
}

/* ================= HISTORY ================= */

function saveHistory(c) {
  let h = JSON.parse(localStorage.getItem("h") || "[]");
  if (!h.includes(c)) h.push(c);
  localStorage.setItem("h", JSON.stringify(h));
}

function loadHistory() {
  let h = JSON.parse(localStorage.getItem("h") || "[]");
  document.getElementById("history").innerHTML =
    h.slice(-5).map(x => `<span onclick="getWeather('${x}')">${x}</span>`).join("");
}
</script>

</body>
</html>
