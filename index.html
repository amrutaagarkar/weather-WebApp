<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Weather App</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
min-height:100vh;
background:linear-gradient(to right,#1d4350,#a43931);
color:#fff;
padding:20px;
transition:0.4s;
}

.dark{background:#000;}

.container{max-width:1200px;margin:auto;}

.app{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
padding:25px;
border-radius:25px;
}

.title{text-align:center;font-size:35px;margin-bottom:20px;}

.search-box{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}

.search-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.search-box button{
padding:12px 15px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

#search-btn{background:#00b894;color:#fff;}
#location-btn{background:#0984e3;color:#fff;}
#dark-btn{background:#2d3436;color:#fff;}

.weather{display:none;}

.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;}

.temp{font-size:60px;font-weight:700;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.15);
padding:15px;
border-radius:15px;
text-align:center;
}

.forecast-container,.hourly-container{
display:flex;
overflow-x:auto;
gap:10px;
margin-top:15px;
}

.forecast-card,.hour-card{
min-width:140px;
background:rgba(255,255,255,0.15);
padding:10px;
border-radius:12px;
text-align:center;
}

canvas{
margin-top:20px;
background:#fff;
border-radius:10px;
padding:10px;
}

.history span{
display:inline-block;
margin:5px;
padding:6px 10px;
background:rgba(255,255,255,0.2);
border-radius:15px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
<div class="app">

<h1 class="title">Advanced Weather App</h1>

<div class="search-box">
<input id="city" placeholder="Enter city">
<button id="search-btn">Search</button>
<button id="location-btn">Location</button>
<button id="dark-btn">Dark</button>
</div>

<div id="history" class="history"></div>

<div id="weather" class="weather"></div>

</div>
</div>

<script>
const apiKey = "9b14b2cbfdfa41f6b63172731261605";

const cityInput = document.getElementById("city");
const weatherDiv = document.getElementById("weather");
let chartInstance = null;

/* SEARCH */
document.getElementById("search-btn").onclick = () => {
if(cityInput.value.trim()) getWeather(cityInput.value);
};

cityInput.addEventListener("keypress",(e)=>{
if(e.key==="Enter") getWeather(cityInput.value);
});

/* DARK */
document.getElementById("dark-btn").onclick = () => {
document.body.classList.toggle("dark");
};

/* LOCATION */
document.getElementById("location-btn").onclick = () => {
navigator.geolocation.getCurrentPosition(pos=>{
const lat = pos.coords.latitude;
const lon = pos.coords.longitude;
getWeather(`${lat},${lon}`);
});
};

/* FETCH WEATHER */
function getWeather(city){

fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=7&aqi=yes`)
.then(res=>res.json())
.then(data=>{

if(data.error){
alert(data.error.message);
return;
}

saveHistory(city);
showWeather(data);

});
}

/* DISPLAY */
function showWeather(data){

const current = data.current;
const loc = data.location;
const forecast = data.forecast.forecastday;

weatherDiv.style.display="block";

weatherDiv.innerHTML=`
<div class="top">
<div>
<h2>${loc.name}, ${loc.country}</h2>
<p>${loc.localtime}</p>
<div class="temp">${current.temp_c}°C</div>
<p>${current.condition.text}</p>
</div>
<img src="https:${current.condition.icon}">
</div>

<div class="grid">
<div class="card"><h3>Humidity</h3><p>${current.humidity}%</p></div>
<div class="card"><h3>Wind</h3><p>${current.wind_kph} km/h</p></div>
<div class="card"><h3>Pressure</h3><p>${current.pressure_mb} mb</p></div>
<div class="card"><h3>UV</h3><p>${current.uv}</p></div>
<div class="card"><h3>Sunrise</h3><p>${forecast[0].astro.sunrise}</p></div>
<div class="card"><h3>Sunset</h3><p>${forecast[0].astro.sunset}</p></div>
</div>

<h3>Hourly Forecast</h3>
<div class="hourly-container">
${forecast[0].hour.slice(0,12).map(h=>`
<div class="hour-card">
<p>${h.time.split(" ")[1]}</p>
<img src="https:${h.condition.icon}">
<p>${h.temp_c}°C</p>
</div>`).join("")}
</div>

<h3>7 Day Forecast</h3>
<div class="forecast-container">
${forecast.map(d=>`
<div class="forecast-card">
<p>${new Date(d.date).toDateString().slice(0,10)}</p>
<img src="https:${d.day.condition.icon}">
<p>${d.day.avgtemp_c}°C</p>
</div>`).join("")}
</div>

<canvas id="chart"></canvas>
`;

createChart(forecast);
loadHistory();
}

/* CHART FIX */
function createChart(forecast){

const ctx = document.getElementById("chart");

if(chartInstance) chartInstance.destroy();

chartInstance = new Chart(ctx,{
type:"line",
data:{
labels:forecast.map(d=>d.date),
datasets:[{
label:"Temp °C",
data:forecast.map(d=>d.day.avgtemp_c),
borderWidth:2
}]
}
});
}

/* HISTORY */
function saveHistory(city){
let h = JSON.parse(localStorage.getItem("h")||"[]");
if(!h.includes(city)) h.push(city);
localStorage.setItem("h",JSON.stringify(h));
}

function loadHistory(){
let h = JSON.parse(localStorage.getItem("h")||"[]");
const div = document.getElementById("history");
div.innerHTML = h.slice(-5).map(c=>`<span onclick="getWeather('${c}')">${c}</span>`).join("");
}
</script>

</body>
</html>
