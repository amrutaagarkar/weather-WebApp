
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Advanced Weather App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

min-height:100vh;

background:linear-gradient(
to right,
#1d4350,
#a43931
);

padding:20px;

color:white;

transition:0.5s;
}

.dark{
background:black;
}

.container{

max-width:1200px;

margin:auto;
}

.app{

background:rgba(255,255,255,0.12);

backdrop-filter:blur(15px);

border-radius:25px;

padding:25px;

box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.title{

text-align:center;

font-size:40px;

margin-bottom:25px;
}

.search-box{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:25px;
}

.search-box input{

flex:1;

padding:15px;

border:none;

border-radius:12px;

font-size:18px;

outline:none;
}

.search-box button{

padding:15px 20px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

font-weight:600;
}

#search-btn{
background:#00b894;
color:white;
}

#location-btn{
background:#0984e3;
color:white;
}

#dark-btn{
background:#2d3436;
color:white;
}

.weather{
display:none;
}

.top{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:20px;
}

.temp{
font-size:80px;
font-weight:700;
}

.condition{
font-size:24px;
margin-top:10px;
}

.main-icon img{
width:120px;
}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;
}

.card{

background:rgba(255,255,255,0.15);

padding:20px;

border-radius:20px;
}

.forecast-container,
.hourly-container{

display:flex;

gap:15px;

overflow-x:auto;

margin-top:20px;

padding-bottom:10px;
}

.forecast-card,
.hour-card{

min-width:150px;

background:rgba(255,255,255,0.15);

padding:15px;

border-radius:15px;

text-align:center;
}

canvas{

margin-top:25px;

background:white;

border-radius:15px;

padding:10px;
}

@media(max-width:768px){

.temp{
font-size:60px;
}

.title{
font-size:30px;
}

.search-box{
flex-direction:column;
}

.search-box button{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="app">

<h1 class="title">
Advanced Weather App
</h1>

<div class="search-box">

<input
id="city"
type="text"
placeholder="Enter city name">

<button id="search-btn">
Search
</button>

<button id="location-btn">
My Location
</button>

<button id="dark-btn">
Dark Mode
</button>

</div>

<div class="weather" id="weather"></div>

</div>

</div>

<script>

const apiKey =
"9b14b2cbfdfa41f6b63172731261605";

const cityInput =
document.getElementById("city");

const weather =
document.getElementById("weather");

// Search Button

document.getElementById("search-btn")
.addEventListener("click",()=>{

if(cityInput.value.trim() !== ""){

getWeather(cityInput.value);

}

});

// Enter Key

cityInput.addEventListener("keypress",(e)=>{

if(e.key === "Enter"){

getWeather(cityInput.value);

}

});

// Dark Mode

document.getElementById("dark-btn")
.addEventListener("click",()=>{

document.body.classList.toggle("dark");

});

// My Location

document.getElementById("location-btn")
.addEventListener("click",()=>{

navigator.geolocation.getCurrentPosition(

(position)=>{

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${lat},${lon}&days=7&aqi=yes`)
.then(response=>response.json())
.then(data=>{

showWeather(data);

});

}

);

});

// Get Weather

function getWeather(city){

fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=7&aqi=yes`)
.then(response=>response.json())
.then(data=>{

console.log(data);

if(data.error){

alert(data.error.message);

return;

}

showWeather(data);

});

}

// Show Weather

function showWeather(data){

weather.style.display = "block";

const current =
data.current;

const location =
data.location;

const forecast =
data.forecast.forecastday;

weather.innerHTML = `

<div class="top">

<div>

<h2>
${location.name},
${location.country}
</h2>

<p>
${location.localtime}
</p>

<div class="temp">
${current.temp_c}°C
</div>

<div class="condition">
${current.condition.text}
</div>

</div>

<div class="main-icon">

<img src="https:${current.condition.icon}">

</div>

</div>

<div class="grid">

<div class="card">
<h3>Humidity</h3>
<p>${current.humidity}%</p>
</div>

<div class="card">
<h3>Wind</h3>
<p>${current.wind_kph} KM/H</p>
</div>

<div class="card">
<h3>Pressure</h3>
<p>${current.pressure_mb} mb</p>
</div>

<div class="card">
<h3>UV Index</h3>
<p>${current.uv}</p>
</div>

<div class="card">
<h3>Air Quality</h3>
<p>${Math.round(current.air_quality.pm2_5)}</p>
</div>

<div class="card">
<h3>Sunrise</h3>
<p>${forecast[0].astro.sunrise}</p>
</div>

</div>

<h2 style="margin-top:35px;">
7 Day Forecast
</h2>

<div class="forecast-container">

${forecast.map(day=>`

<div class="forecast-card">

<h3>

${new Date(day.date).toLocaleDateString(
'en-US',
{weekday:'short'}
)}

</h3>

<img src="https:${day.day.condition.icon}">

<p>
${day.day.avgtemp_c}°C
</p>

<p>
${day.day.condition.text}
</p>

</div>

`).join("")}

</div>

<canvas id="tempChart"></canvas>
`;

createChart(forecast);

}

// Temperature Chart

function createChart(forecast){

const labels =
forecast.map(day=>
new Date(day.date).toLocaleDateString(
'en-US',
{weekday:'short'}
)
);

const temps =
forecast.map(day=>
day.day.avgtemp_c
);

new Chart(

document.getElementById("tempChart"),

{

type:'line',

data:{

labels:labels,

datasets:[{

label:'Temperature °C',

data:temps,

borderWidth:3,

tension:0.4

}]

}

}

);

}

</script>

</body>

</html>
